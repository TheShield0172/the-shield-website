name: SHIELD PROMOTE preview checks
on:
  push:
    paths:
      - 'promote.html'
      - 'promote.js'
      - 'promote.css'
      - 'tests/promote.test.cjs'
      - '.github/workflows/promote-preview-checks.yml'
  pull_request:
    paths:
      - 'promote.html'
      - 'promote.js'
      - 'promote.css'
      - 'tests/promote.test.cjs'
      - '.github/workflows/promote-preview-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check promote.js
      - name: Run PROMOTE safety, accessibility and track structure tests
        run: node --test tests/promote.test.cjs
