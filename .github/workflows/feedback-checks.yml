name: Anonymous Feedback Form Checks
on:
  push:
    branches:
      - main
      - anonymous-feedback-form
    paths:
      - 'feedback*'
      - 'index.html'
      - 'pilot.html'
      - 'privacy.html'
      - 'render.yaml'
      - 'tests/feedback.test.cjs'
      - '.github/workflows/feedback-checks.yml'
permissions:
  contents: read
concurrency:
  group: anonymous-feedback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-feedback-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check feedback.js
          node --check feedback-config.js
      - name: Run offline form acceptance and safety checks
        run: node --test tests/feedback.test.cjs
